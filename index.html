<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alysion Collection</title>
  <link rel="stylesheet" href="styles.css">
  <script src="src/theme.js"></script>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>Alysion Collection</h1>
      <div id="accounts" class="accounts" role="group" aria-label="Account"></div>
      <div class="balance">
        <label for="cp-balance">CP balance</label>
        <input id="cp-balance" type="number" min="0" step="1" inputmode="numeric">
        <p id="surplus-summary"></p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
    </div>
    <nav id="tabs" aria-label="Sections"></nav>
  </header>
  <p id="notice" class="notice" role="alert" hidden></p>
  <main id="view"></main>
  <dialog id="card-dialog" aria-labelledby="card-dialog-title"></dialog>

  <script src="data/cards.js"></script>
  <script src="data/decks.js"></script>
  <script src="data/decks-guides.js"></script>
  <script src="data/decks-community.js"></script>
  <script src="data/staples.js"></script>
  <script src="data/packs.js"></script>
  <script src="src/core.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
